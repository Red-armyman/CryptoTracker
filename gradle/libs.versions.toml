[versions]
agp = "9.1.1"
coilNetworkOkhttp = "3.5.0"
converterKotlinxSerialization = "3.0.0"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlinxCoroutines = "1.11.0"
lifecycleRuntimeCompose = "2.8.2"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.13.0"
kotlin = "2.4.0"
hilt = "2.60"
hiltNavigationCompose = "1.3.0"
ksp = "2.3.10"
loggingInterceptor = "5.4.0"
okhttp = "5.4.0"
retrofit = "3.0.0"
timber = "5.0.1"
kotlinxSerialization = "1.7.3"
kotlinxCollectionsImmutable = "0.3.4"
androidx-room3 = "3.0.0-rc01"
coil = "3.1.0"
datastore = "1.1.1"
protobuf-plugin = "0.10.0"
protobuf = "4.26.1"
tink = "1.15.0"
turbine = "1.1.0"
mockk = "1.13.12"
compose-ui = "1.11.4"
compose-material3 = "1.4.0"
compose-icons = "1.7.8"
coreSplashscreen = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose UI
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose-ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose-ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose-ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose-ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "compose-icons" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose-icons" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Network & Serialization
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "converterKotlinxSerialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Database (Room 3)
room3 = { module = "androidx.room3:room3-runtime", version.ref = "androidx-room3" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "androidx-room3" }

# Coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coilNetworkOkhttp" }

# DataStore & Security
androidx-datastore-core = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
protobuf = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobuf" } # ВЕРНУЛ КАК БЫЛО
google-crypto-tink = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }

# Utils
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

# Unit Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
cashapp-turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
io-mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
room3 = { id = "androidx.room3", version.ref = "androidx-room3" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
android-library = { id = "com.android.library", version.ref = "agp" }

[bundles]
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
    "androidx-compose-material-icons-core"
]
network = [
    "okhttp",
    "logging-interceptor",
    "retrofit",
    "converter-kotlinx-serialization",
    "kotlinx-serialization-json"
]
coil = [
    "coil-compose",
    "coil-network-okhttp"
]
unit-tests = [
    "io-mockk",
    "cashapp-turbine",
    "junit",
    "androidx-junit",
    "kotlinx-coroutines-test"
]